<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - CEPCI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f1f1;
        }

        .header {
            background: #8c1936;
            padding: 15px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back {
            background: #CFB53B;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            color: #8c1936;
            font-weight: bold;
        }

        .back:hover {
            background: white;
        }

        .container {
            margin: 40px auto;
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        h2 {
            color: #001f54;
            text-align: center;
            margin-bottom: 30px;
        }

        .warning-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .form-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .form-section:last-of-type {
            border-bottom: none;
        }

        label {
            font-weight: bold;
            color: #8c1936;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #8c1936;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #CFB53B;
            box-shadow: 0 0 6px #CFB53B;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #8c1936;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn:hover {
            background: #CFB53B;
            color: #8c1936;
        }

        .msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
        }

        .msg.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .msg.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1976d2;
        }
    </style>

</head>
<body>

    <div class="header">
        🔐 Acceso Restringido - Solo Personal Autorizado
        <div class="back" onclick="location.href='dashboard.html'">Regresar</div>
    </div>

    <div class="container">
        <h2>Gestión de Seguridad</h2>

        <div class="warning-box">
            ⚠️ ÁREA RESTRINGIDA - Solo para personal autorizado
        </div>

        <div class="info-box">
            ℹ️ En esta sección puedes cambiar la contraseña del acceso de administrador
        </div>

        <div class="form-section">
            <h3 style="color: #8c1936; margin-top: 0;">Cambiar Contraseña de Administrador</h3>
            
            <label for="adminPasswordActual">Contraseña Actual:</label>
            <input type="password" id="adminPasswordActual" placeholder="Ingrese la contraseña actual" required>

            <label for="adminPasswordNueva">Nueva Contraseña:</label>
            <input type="password" id="adminPasswordNueva" placeholder="Ingrese la nueva contraseña" required minlength="8">

            <label for="adminPasswordConfirmar">Confirmar Nueva Contraseña:</label>
            <input type="password" id="adminPasswordConfirmar" placeholder="Confirme la nueva contraseña" required minlength="8">

            <button class="btn" onclick="cambiarContraseña()">Cambiar Contraseña</button>

            <div id="msg" class="msg" style="display: none;"></div>
        </div>

    </div>

    <script src="js/db.js"></script>
    <script>
        // Validar acceso - solo debería accederse con la combinación de teclas
        if (!sessionStorage.getItem("acceso_restringido")) {
            alert("Acceso denegado. Debe acceder mediante la combinación de teclas correcta.");
            window.location.href = "dashboard.html";
        }

        async function cambiarContraseña() {
            const passwordActual = document.getElementById("adminPasswordActual").value.trim();
            const passwordNueva = document.getElementById("adminPasswordNueva").value.trim();
            const passwordConfirmar = document.getElementById("adminPasswordConfirmar").value.trim();
            const msg = document.getElementById("msg");

            // Validaciones
            if (!passwordActual || !passwordNueva || !passwordConfirmar) {
                msg.style.display = "block";
                msg.className = "msg error";
                msg.textContent = "❌ Todos los campos son obligatorios.";
                return;
            }

            if (passwordNueva.length < 8) {
                msg.style.display = "block";
                msg.className = "msg error";
                msg.textContent = "❌ La nueva contraseña debe tener al menos 8 caracteres.";
                return;
            }

            if (passwordNueva !== passwordConfirmar) {
                msg.style.display = "block";
                msg.className = "msg error";
                msg.textContent = "❌ Las contraseñas no coinciden.";
                return;
            }

            try {
                await initIndexedDB();
                
                // Verificar contraseña actual en BD
                const adminUser = await obtenerUsuarioLogin('AdminCepci01');
                
                if (!adminUser || adminUser.password !== passwordActual) {
                    msg.style.display = "block";
                    msg.className = "msg error";
                    msg.textContent = "❌ La contraseña actual es incorrecta.";
                    return;
                }

                // Actualizar contraseña en BD
                adminUser.password = passwordNueva;
                await actualizarUsuarioLogin(adminUser);

                // También guardar en localStorage como respaldo
                localStorage.setItem("adminPassword", passwordNueva);

                msg.style.display = "block";
                msg.className = "msg success";
                msg.textContent = "✔️ Contraseña cambiada exitosamente. La nueva contraseña se aplicará en el próximo acceso.";

                // Limpiar campos
                document.getElementById("adminPasswordActual").value = "";
                document.getElementById("adminPasswordNueva").value = "";
                document.getElementById("adminPasswordConfirmar").value = "";

                // Redirigir después de 2 segundos
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 2000);

            } catch (error) {
                console.error(error);
                msg.style.display = "block";
                msg.className = "msg error";
                msg.textContent = "❌ Error al cambiar la contraseña: " + error.message;
            }
        }
    </script>

</body>
</html>
