<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Alumno - CEPCI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        .header {
            background: #8c1936;
            padding: 15px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back {
            background: #CFB53B;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            color: #8c1936;
            font-weight: bold;
        }

        .back:hover {
            background: white;
        }

        .container {
            margin: 30px auto;
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 14px rgba(0,0,0,0.2);
        }

        h2 {
            color: #001f54;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #8c1936;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 2px solid #8c1936;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: #CFB53B;
            box-shadow: 0 0 6px #CFB53B;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #8c1936;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
        }

        .btn:hover {
            background: #CFB53B;
            color: #8c1936;
        }

        .msg {
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }

        .info-box {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #8c1936;
            margin-bottom: 15px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="header">
        Registrar Alumno - CEPCI
        <div class="back" onclick="location.href='dashboard.html'">Regresar</div>
    </div>

    <div class="container">
        <h2>Formulario de Registro</h2>

        <div class="info-box">
            ℹ️ El código del alumno se asignará automáticamente por el sistema.
        </div>

        <form id="formRegistro" onsubmit="event.preventDefault(); registrarAlumno();">
            
            <label for="asesor">Asesor Responsable:</label>
            <select id="asesor" required>
                <option value="">Seleccione un asesor…</option>
            </select>

            <label for="curso">Curso:</label>
            <select id="curso" required>
                <option value="">Seleccione curso…</option>
                <option value="Computacion">Computación</option>
                <option value="Belleza">Belleza</option>
                <option value="Ingles">Inglés</option>
            </select>

            <label for="matricula">Matrícula (Se asigna automáticamente):</label>
            <input type="text" id="matricula" placeholder="ALUMNO0000000001" readonly />

            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" placeholder="Nombre del alumno" required />

            <label for="sexo">Sexo:</label>
            <select id="sexo" required>
                <option value="">Seleccione…</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
                <option value="Otro">Otro</option>
            </select>

            <label for="fecha">Fecha de Inscripción:</label>
            <input type="date" id="fecha" required />

            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_nacimiento" required />

            <label for="edad">Edad (calculada automáticamente):</label>
            <input type="number" id="edad" readonly />

            <label for="telefono">Número de Teléfono:</label>
            <input type="text" id="telefono" placeholder="Ejemplo: 999 999 9999" required />

            <label for="tutor">Nombre del Tutor:</label>
            <input type="text" id="tutor" placeholder="Ejemplo: Juan Pérez" required />

            <label for="direccion">Dirección (opcional):</label>
            <input type="text" id="direccion" placeholder="Dirección completa" />

            <label for="colonia_calle_referencia">Colonia, Calle, Referencia adicionales:</label>
            <input type="text" id="colonia_calle_referencia" placeholder="Colonia / Calle / Referencia" required />

            <label for="poblacion">Población:</label>
            <input type="text" id="poblacion" placeholder="Población" required />

            <label for="costo_colegiatura">Asignar costo de colegiatura (opcional):</label>
            <input type="number" id="costo_colegiatura" min="0" step="0.01" placeholder="0.00 (opcional)" />

            <label for="horario">Horario:</label>
            <select id="horario" required>
                <option value="">Seleccione un horario…</option>
                <option value="SÁBADO 8 AM - 12 PM">SÁBADO 8 AM - 12 PM</option>
                <option value="SÁBADO 12 PM - 4 PM">SÁBADO 12 PM - 4 PM</option>
                <option value="DOMINGO 8 AM - 12 PM">DOMINGO 8 AM - 12 PM</option>
                <option value="DOMINGO 12 PM - 4 PM">DOMINGO 12 PM - 4 PM</option>
            </select>

            <label for="fecha_primer_pago">Fecha de Primer Pago:</label>
            <input type="date" id="fecha_primer_pago" required />

            <button type="submit" class="btn">Registrar Alumno</button>
            <div id="msg" class="msg"></div>
        </form>
    </div>

    <script src="js/db.js"></script>
    <script>
        // Protección: si no inició sesión, regresar
        if (sessionStorage.getItem("logged") !== "true") {
            window.location.href = "index.html";
        }

        // Cargar asesores y matrícula al abrir la página
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await initIndexedDB();
                
                // Cargar asesores
                const asesores = await cargarAsesores();
                const selectAsesor = document.getElementById('asesor');
                asesores.forEach(asesor => {
                    const option = document.createElement('option');
                    option.value = asesor.id;
                    option.textContent = asesor.nombre + ' (ID: ' + asesor.id + ')';
                    selectAsesor.appendChild(option);
                });
                
                // Cargar horarios
                await inicializarHorariosPorDefecto();
                const horarios = await cargarHorarios();
                const selectHorario = document.getElementById('horario');
                selectHorario.innerHTML = '<option value="">Seleccione un horario…</option>';
                horarios.forEach(h => {
                    const option = document.createElement('option');
                    option.value = h.nombre;
                    option.textContent = h.nombre;
                    selectHorario.appendChild(option);
                });
                
                // Cargar próxima matrícula
                const proximaMatricula = await obtenerProximaMatricula();
                document.getElementById('matricula').value = proximaMatricula;

                // Configurar cálculo de edad
                document.getElementById('fecha_nacimiento').addEventListener('change', actualizarEdad);
            } catch (error) {
                console.error('Error cargando datos:', error);
            }
        });

        function actualizarEdad() {
            const fechaNacimiento = document.getElementById('fecha_nacimiento').value;
            const edad = window.calcularEdad(fechaNacimiento); // usa la función global de db.js
            document.getElementById('edad').value = edad || '';
        }

        async function obtenerProximaMatricula() {
            const alumnos = await cargarAlumnos();
            if (!alumnos || alumnos.length === 0) return 'ALUMNO0000000001';
            const maxNum = Math.max(...alumnos.map(a => {
                const match = String(a.matricula || '').match(/(\d+)$/);
                return match ? parseInt(match[1]) : 0;
            }));
            const nextNum = maxNum + 1;
            return 'ALUMNO' + String(nextNum).padStart(7, '0');
        }

        async function registrarAlumno() {
            const asesorId = document.getElementById('asesor').value;
            const nombre = document.getElementById('nombre').value.trim();
            const fechaNacimiento = document.getElementById('fecha_nacimiento').value;
            let edad = document.getElementById('edad').value.trim();
            const sexo = document.getElementById('sexo').value;
            const fecha = document.getElementById('fecha').value;
            const telefono = document.getElementById('telefono').value.trim();
            const tutor = document.getElementById('tutor').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            const coloniaCalleReferencia = document.getElementById('colonia_calle_referencia').value.trim();
            const poblacion = document.getElementById('poblacion').value.trim();
            const costoColegiaturaRaw = document.getElementById('costo_colegiatura').value.trim();
            const costoColegiatura = costoColegiaturaRaw === '' ? null : parseFloat(costoColegiaturaRaw);
            const horario = document.getElementById('horario').value;
            const fechaPrimerPago = document.getElementById('fecha_primer_pago').value;
            const msg = document.getElementById('msg');

            // Calcular edad si no está presente
            if (!edad && fechaNacimiento) {
                const calculated = window.calcularEdad(fechaNacimiento);
                if (calculated !== null) {
                    edad = calculated.toString();
                    document.getElementById('edad').value = edad;
                }
            }

            if (!asesorId || !nombre || !fechaNacimiento || !edad || !sexo || !fecha || !telefono || !tutor || !coloniaCalleReferencia || !poblacion || !horario || !fechaPrimerPago) {
                msg.style.color = 'red';
                msg.textContent = 'Todos los campos obligatorios deben completarse. La dirección y el costo de colegiatura son opcionales.';
                return;
            }
            if (costoColegiaturaRaw !== '' && (isNaN(costoColegiatura) || costoColegiatura < 0)) {
                msg.style.color = 'red';
                msg.textContent = 'El costo de colegiatura debe ser un número válido mayor o igual a 0.';
                return;
            }

            try {
                await initIndexedDB();

                // Obtener próximo código automáticamente
                const proximoCodigo = await obtenerProximoCodigoAlumno();
                
                // Obtener próxima matrícula automáticamente
                const matricula = await obtenerProximaMatricula();

                // Obtener curso seleccionado
                const curso = document.getElementById('curso').value;

                const nuevoAlumno = {
                    asesor_id: parseInt(asesorId),
                    curso, // "Computacion" o "Belleza"
                    matricula,
                    nombre,
                    fecha_nacimiento: fechaNacimiento,
                    edad: parseInt(edad),
                    sexo,
                    fecha_inscripcion: fecha,
                    telefono,
                    tutor,
                    direccion,
                    colonia_calle_referencia: coloniaCalleReferencia,
                    poblacion,
                    costo_colegiatura: costoColegiatura,
                    horario,
                    fecha_primer_pago: fechaPrimerPago,
                    codigo: proximoCodigo,
                    pagos_realizados: 0,
                    pagos_totales: 55, // quedará visualmente actualizado por veralumnos.html usando settings
                    monto_cobro: costoColegiatura != null ? costoColegiatura : 0,
                    becado: false, // nuevo flag
                    custom_cost: costoColegiatura != null ? costoColegiatura : null,
                    baja_temporal: false,
                    pagos: [],
                    fecha_registro: new Date().toISOString()
                };

                // Guardar en IndexedDB
                const saved = await agregarAlumno(nuevoAlumno);

                msg.style.color = 'green';
                msg.textContent = '✔ Alumno registrado correctamente - Matrícula: ' + matricula + ' | Código: ' + proximoCodigo + ' (ID: ' + saved.id + ')';

                // Resetear formulario
                document.getElementById('formRegistro').reset();
                
                // Actualizar campo matrícula con la próxima
                document.getElementById('matricula').value = await obtenerProximaMatricula();

                // Limpiar mensaje después de 2 segundos
                setTimeout(() => {
                    msg.textContent = '';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                msg.style.color = 'red';
                msg.textContent = 'Error al guardar alumno: ' + error.message;
            }
        }
    </script>
</body>
</html>
